<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configuration compte</title>
<p style="margin-bottom:20px;color:#cbd5e1;">
Choisissez une méthode de connexion :
fichier M3U, URL M3U ou serveur IPTV.
</p>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,sans-serif;
    background:#0f172a;
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:15px;
    color:#00d4ff;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
}

button{
    background:#0ea5e9;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0284c7;
}

.back-btn{
    background:#334155;
    margin-bottom:20px;
}

.back-btn:hover{
    background:#475569;
}

</style>

</head>
<body>

<div class="container">

    <button
        class="back-btn"
        onclick="location.href='index.html'">
        ← Retour IPTV
    </button>
    
    <h1>⚙️ Configuration IPTV</h1>
    
    <!-- M3U Fichier -->

    <div class="card">

        <h2>📁 Importer un fichier M3U</h2>

        <input
            id="m3uFile"
            type="file"
            accept=".m3u"
        >
     
    </div>
    
    <!-- URL M3U -->

    <div class="card">

        <h2>🌐 URL M3U</h2>

        <input
            id="m3uUrl"
            type="text"
            placeholder="https://monserveur.com/playlist.m3u"
        >

        <button id="loadM3uBtn">
            Charger la playlist
        </button>

    </div>

    <!-- Xtream -->
    
    <div class="card">

        <h2>⚙️ Connexion IPTV</h2>

        <input
            id="server"
            type="text"
            placeholder="Serveur"
        >

        <input
            id="username"
            type="text"
            placeholder="Utilisateur"
        >

        <input
            id="password"
            type="password"
            placeholder="Mot de passe"
        >

        <button id="connectBtn">
            Connexion
        </button>
        <button id="saveBtn">
               💾 Sauvegarder
        </button>
    </div>

</div>

<script>
    
document
.getElementById("m3uFile")
.addEventListener("change", e => {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = evt => {

        localStorage.setItem(
            "playlistContent",
            evt.target.result
        );

        alert("Playlist enregistrée");

    };

    reader.readAsText(file);

});
document
.getElementById("loadM3uBtn")
.addEventListener("click", () => {

    const url =
        document.getElementById("m3uUrl").value;

    if(!url){
        alert("Entrez une URL M3U");
        return;
    }

    localStorage.setItem(
        "iptv_m3u_url",
        url
    );

    alert("URL enregistrée");
});

document
.getElementById("connectBtn")
.addEventListener("click", () => {

    const server =
        document.getElementById("server").value;

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    localStorage.setItem(
        "iptv_server",
        server
    );

    localStorage.setItem(
        "iptv_username",
        username
    );

    localStorage.setItem(
        "iptv_password",
        password
    );

    alert("Informations enregistrées");
});

</script>
    // Fonc
<h2>Exporter une liste en fichier texte</h2>
    <button id="saveBtn">Sauvegarder la liste</button>

    <script>
        // Exemple de liste
        const maListe = ["Pomme", "Banane", "Cerise", "Mangue"];

        // Fonction pour sauvegarder la liste dans un fichier
        function sauvegarderListe(liste, nomFichier) {
            try {
                if (!Array.isArray(liste)) {
                    throw new Error("Le paramètre fourni n'est pas une liste.");
                }

                // Convertir la liste en texte (une ligne par élément)
                const contenu = liste.join("\n");

                // Créer un objet Blob contenant le texte
                const blob = new Blob([contenu], { type: "text/plain;charset=utf-8" });

                // Créer un lien de téléchargement temporaire
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = nomFichier;

                // Déclencher le téléchargement
                document.body.appendChild(a);
                a.click();

                // Nettoyer
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                console.log(`Fichier "${nomFichier}" sauvegardé avec succès.`);
            } catch (err) {
                console.error("Erreur lors de la sauvegarde :", err.message);
            }
        }

        // Événement sur le bouton
        document.getElementById("saveBtn").addEventListener("click", () => {
            sauvegarderListe(maListe, "ma_liste.txt");
        });
    </script>

    
</body>
</html>
