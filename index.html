<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KML IPTV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!---Menu superieur principal--->

<div class="top-bar">

    <button id="btnBouquets">📺 Bouquets</button>

    <button id="btnCanaux">📡 Canaux</button>

    <button onclick="location.href='iptv.html'">
        ⚙️ Menu
    </button>

    <input
        id="searchInput"
        type="text"
        placeholder="🔍 Recherche..."
    >  
<!----
    <input
        id="m3uFile"
        type="file"
        accept=".m3u"
    > --->

</div>


<div id="iptvPanel" class="hidden">

    <input
        id="server"
        placeholder="Serveur"
    >

    <input
        id="username"
        placeholder="Utilisateur"
    >

    <input
        id="password"
        type="password"
        placeholder="Mot de passe"
    >

    <button id="connectBtn">
        Connexion
    </button>

</div>   
  
</div>
    <!---
    <input
        type="text"
        id="searchInput"
        placeholder="🔎 Recherche..."
    >
    <input
        type="file"
        id="m3uFile"
        accept=".m3u"
    >
---->
</div>
<div class="app">

    <aside class="sidebar">
        <!---<h2>Bouquets</h2>-->
        <ul id="bouquet-list"></ul>
    </aside>

    <section class="channels-panel">
        <!--<h2>Chaînes</h2>-->
        <ul id="channel-list"></ul>
    </section>

    <section class="player-panel">

        <div class="player-header">
            <h2 id="current-channel">
                Aucune chaîne sélectionnée
            </h2>
        </div>

        <video
            id="video"
            controls
            autoplay
            playsinline>
        </video>

    </section>
<input type="file" id="m3uFile" accept=".m3u">
</div>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Lecture URL manuelle -->
 <script src="iptv.js"></script>   
  <!---<script src="iptv.html"></script>--->

</body>
</html>
