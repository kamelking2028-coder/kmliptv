<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KML IPTV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <h2>Bouquets</h2>
        <ul id="bouquet-list"></ul>
    </aside>

    <section class="channels-panel">
        <h2>Chaînes</h2>
        <ul id="channel-list"></ul>
    </section>

    <section class="player-panel">
        <h2 id="current-channel">
            Aucune chaîne sélectionnée
        </h2>

        <video
            id="video"
            controls
            autoplay
            playsinline>
        </video>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="iptv.js"></script>

</body>
</html>
